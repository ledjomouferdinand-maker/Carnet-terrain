      } catch (e) { console.error("Erreur Firebase:", e); }
    }
    window.cloudStorage = {
      saveSession: function (id, data) {
        if (!window.CT_CLOUD_READY) return Promise.reject(new Error("Firebase non prêt"));
        return window.CT_DB.collection("carnet_terrain_scores").doc(id).set(data, { merge: true });

        if (!window.CT_CLOUD_READY) return Promise.reject(new Error("Firebase non prêt"));

          return snap.docs.map(function (d) { return d.data(); });
        });
      }
    };
  })();
</script>

    var s4 = useState(false); var saveError = s4[0], setSaveError = s4[1];
    var s5 = useState(""); var codeDraft = s5[0], setCodeDraft = s5[1];
    var s6 = useState(false); var codeError = s6[0], setCodeError = s6[1];

    var s7 = useState("tous"); var tab = s7[0], setTab = s7[1];
    var s8 = useState("tous"); var themeFilter = s8[0], setThemeFilter = s8[1];
    var s9 = useState(function () { return shuffle(DATA.map(function (d) { return d.id; })); }); var order = s9[0], setOrder = s9[1];
    var s10 = useState(0); var pos = s10[0], setPos = s10[1];
    var s11 = useState(null); var selected = s11[0], setSelected = s11[1];
    var s12 = useState(false); var flipped = s12[0], setFlipped = s12[1];
    var s13 = useState({ correct: 0, seen: 0 }); var score = s13[0], setScore = s13[1];

    useEffect(function () {
      if (view !== "quiz" || !name || score.seen === 0) return;
      var id = name.trim().toLowerCase();
      var payload = { name: name.trim(), correct: score.correct, seen: score.seen, updatedAt: new Date().toISOString() };
      window.cloudStorage.saveSession(id, payload).catch(function () { setSaveError(true); });
    }, [score, view, name]);

    var filtered = useMemo(function () {
      return order.map(function (id) { return DATA.filter(function (d) { return d.id === id; })[0]; })
        .filter(function (d) { return tab === "tous" || d.type === tab; })
        .filter(function (d) { return themeFilter === "tous" || d.theme === themeFilter; });
    }, [order, tab, themeFilter]);

    var current = filtered.length ? filtered[pos % filtered.length] : null;

    var goNext = useCallback(function () {
      setSelected(null); setFlipped(false);
      setPos(function (p) { return filtered.length ? (p + 1) % filtered.length : 0; });
    }, [filtered.length]);

    var goPrev = useCallback(function () {
      setSelected(null); setFlipped(false);
      setPos(function (p) { return filtered.length ? (p - 1 + filtered.length) % filtered.length : 0; });
    }, [filtered.length]);

    var reshuffle = function () {
      setOrder(shuffle(DATA.map(function (d) { return d.id; })));
      setPos(0); setSelected(null); setFlipped(false);
      setScore({ correct: 0, seen: 0 });
    };

    var pick = function (idx) {
      if (selected !== null) return;
      setSelected(idx);
      setScore(function (s) { return { correct: s.correct + (idx === current.answer ? 1 : 0), seen: s.seen + 1 }; });
    };

    var changeTab = function (key) { setTab(key); setPos(0); setSelected(null); setFlipped(false); };
    var changeTheme = function (key) { setThemeFilter(key); setPos(0); setSelected(null); setFlipped(false); };

    if (view === "entry") {
      return h('div', { style: styles.page },
        h('div', { style: styles.entryWrap },
          h('div', { style: styles.eyebrow }, 'CARNET'),
          h('h1', { style: styles.title }, 'Terrain'),
          h('p', { style: styles.tagline }, 'Révision paramédicale — cours & terrain'),
          h('div', { style: styles.entryCard },
            h('label', { style: styles.entryLabel }, 'Ton prénom (ou pseudo)'),
            h('input', {
              style: styles.entryInput, value: nameDraft,
              onChange: function (e) { setNameDraft(e.target.value); },
              placeholder: 'ex. Awa, Junior…', maxLength: 30
            }),
            h('button', {
              style: styles.primaryBtn, disabled: !nameDraft.trim(),
              onClick: function () { setName(nameDraft.trim()); setView("quiz"); }
            }, 'Commencer'),
            h('p', { style: styles.entryHint }, "Ton prénom permet au formateur de voir ta progression. Aucune autre donnée n'est demandée."),
            h('button', { style: styles.adminLink, onClick: function () { setView("admin-gate"); } }, 'Je suis formateur → voir les scores')
          )
        )
      );
    }

    if (view === "admin-gate") {
      var inputChildren = [
        h('label', { style: styles.entryLabel, key: 'lbl' }, "Code d'accès"),
        h('input', {
          style: styles.entryInput, type: 'password', value: codeDraft, key: 'inp',
          onChange: function (e) { setCodeDraft(e.target.value); setCodeError(false); },
          placeholder: '••••••',
          onKeyDown: function (e) { if (e.key === 'Enter') { if (codeDraft === window.ADMIN_CODE) setView("admin"); else setCodeError(true); } }
        })
      ];
      if (codeError) inputChildren.push(h('p', { style: styles.codeError, key: 'err' }, 'Code incorrect.'));
      inputChildren.push(h('button', {
        style: styles.primaryBtn, disabled: !codeDraft, key: 'submit',
        onClick: function () { if (codeDraft === window.ADMIN_CODE) setView("admin"); else setCodeError(true); }
      }, 'Valider'));
      inputChildren.push(h('button', {
        style: styles.adminLink, key: 'back',
        onClick: function () { setCodeDraft(""); setCodeError(false); setView(name ? "quiz" : "entry"); }
      }, '← Retour'));

      return h('div', { style: styles.page },
        h('div', { style: styles.entryWrap },
          h('div', { style: styles.eyebrow }, 'ACCÈS RÉSERVÉ'),
          h('h1', { style: styles.title }, 'Formateur'),
          h('p', { style: styles.tagline }, 'Entre le code pour voir les scores'),
          h('div', { style: styles.entryCard }, inputChildren)
        )
      );
    }

    if (view === "admin") {
      return h('div', { style: styles.page }, h(AdminView, { onBack: function () { setView(name ? "quiz" : "entry"); } }));
    }

    var themeChips = [h('button', {
      key: 'tous', onClick: function () { changeTheme("tous"); },
      style: Object.assign({}, styles.themeChip, {
        borderColor: themeFilter === "tous" ? "#1B2A4A" : "transparent",
        background: themeFilter === "tous" ? "#1B2A4A" : "#EFE9DA",
        color: themeFilter === "tous" ? "#F6F1E4" : "#1B2A4A"
      })
    }, 'Tous thèmes')];
    Object.keys(THEMES).forEach(function (key) {
      var t = THEMES[key];
      themeChips.push(h('button', {
        key: key, onClick: function () { changeTheme(key); },
        style: Object.assign({}, styles.themeChip, {
          borderColor: themeFilter === key ? t.color : "transparent",
          background: themeFilter === key ? t.color : "#EFE9DA",
          color: themeFilter === key ? "#fff" : "#1B2A4A"
        })
      }, t.label));
    });

    var mainContent = !current
      ? h('div', { style: styles.empty },
          h('p', { style: styles.emptyText }, 'Aucune fiche pour ce filtre.'),
          h('button', { style: styles.primaryBtn, onClick: function () { changeTheme("tous"); } }, 'Réinitialiser les filtres')
        )
      : h(Card, {
          item: current, theme: THEMES[current.theme], index: pos + 1, total: filtered.length,
          selected: selected, flipped: flipped,
          onFlip: function () { setFlipped(function (f) { return !f; }); }, onPick: pick
        });

    var headerChildren = [
      h('div', { style: styles.headerTop, key: 'top' },
        h('div', null, h('div', { style: styles.eyebrow }, 'CARNET'), h('h1', { style: styles.title }, 'Terrain')),
        h('div', { style: styles.scoreBox },
          h('div', { style: styles.scoreNum }, score.correct + '/' + score.seen),
          h('div', { style: styles.scoreLabel }, name)
        )
      ),
      h('div', { style: styles.headerRow2, key: 'row2' },
        h('p', { style: styles.tagline }, 'Révision paramédicale — cours & terrain'),
        h('button', { style: styles.adminMini, onClick: function () { setView("admin-gate"); } }, '📊 Formateur')
      )
    ];
    if (saveError) headerChildren.push(h('p', { style: styles.saveError, key: 'saveErr' }, 'Score non synchronisé (vérifie ta connexion ou la config Firebase).'));

    var footer = current ? h('footer', { style: styles.footer },
      h('button', { style: styles.navBtn, onClick: goPrev, 'aria-label': 'Précédent' }, '‹'),
      h('button', { style: styles.shuffleBtn, onClick: reshuffle }, '↻ Mélanger'),
      h('button', { style: styles.navBtn, onClick: goNext, 'aria-label': 'Suivant' }, '›')
    ) : null;

    return h('div', { style: styles.page },
      h('header', { style: styles.header }, headerChildren),
      h('nav', { className: 'ct-scroll', style: styles.tabRow }, TABS.map(function (t) {
        return h('button', {
          key: t.key, onClick: function () { changeTab(t.key); },
          style: Object.assign({}, styles.tabBtn, tab === t.key ? styles.tabBtnActive : {})
        }, t.label);
      })),
      h('div', { className: 'ct-scroll', style: styles.themeRow }, themeChips),
      h('main', { style: styles.main }, mainContent),
      footer
    );
  }

  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(h(CarnetTerrain));
})();
</script>
</body>
</html>
