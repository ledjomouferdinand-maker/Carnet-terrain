        window.CT_CLOUD_READY = true;
      } catch (e) {

    window.cloudStorage = {
      async saveSession(id, data) {

const { useState, useMemo, useCallback, useEffect } = React;

/* ---------------------------------------------------------

const THEMES = {

  { id: 1, type: "qcm", theme: "urgences",

  { id: 3, type: "cas", theme: "paludisme",
    stem: "Un enfant de 4 ans est amené au centre de santé pour fièvre à 39,5°C évoluant depuis 2 jours, avec vomissements et prostration. La TDR palu revient positive.",

  { id: 4, type: "fiche", theme: "drepano",
    front: "Crise vaso-occlusive (CVO) — définition",
    back: "Occlusion de la microcirculation par des hématies falciformes, provoquant une ischémie tissulaire douloureuse. Facteurs déclenchants : froid, déshydratation, infection, effort, hypoxie, stress." },
  { id: 5, type: "qcm", theme: "drepano",
    q: "Quelle est la première mesure thérapeutique devant une CVO aux urgences ?",
    options: ["Transfusion systématique", "Hyperhydratation et antalgie précoce", "Antibiothérapie systématique", "Mise à jeun strict"], answer: 1,
    explanation: "L'hyperhydratation (orale ou IV) et une antalgie précoce et adaptée à l'intensité de la douleur sont les piliers immédiats de la prise en charge d'une CVO." },
  { id: 6, type: "cas", theme: "contraception",
    stem: "Une patiente de 28 ans, nullipare, sans antécédent notable, souhaite débuter une contraception orale combinée.",

  { id: 7, type: "fiche", theme: "urgences",

    back: "Ouverture des yeux (4) + Réponse verbale (5) + Réponse motrice (6) = /15. Un score ≤ 8 signe un coma et impose la protection des voies aériennes." },
  { id: 8, type: "qcm", theme: "soins",
    q: "Avant toute injection intramusculaire, quel geste est indispensable pour éviter une injection intravasculaire accidentelle ?",
    options: ["Masser le point d'injection", "Aspirer avant d'injecter", "Injecter très lentement uniquement", "Réchauffer le produit"], answer: 1,
    explanation: "L'aspiration préalable permet de vérifier l'absence de reflux sanguin, signe que l'aiguille n'est pas dans un vaisseau." },
  { id: 9, type: "fiche", theme: "paludisme",
    front: "Traitement de 1ère ligne du paludisme simple (OMS)",
    back: "Combinaison thérapeutique à base d'artémisinine (CTA), ex. Artéméther-Luméfantrine, sur 3 jours. Le paludisme grave nécessite un traitement parentéral (artésunate IV)." },
  { id: 10, type: "qcm", theme: "urgences",
    q: "Chez un patient en détresse respiratoire aiguë, quelle est la priorité immédiate ?",
    options: ["Prise de la température", "Libération et contrôle des voies aériennes", "Pose d'une sonde urinaire", "Interrogatoire complet"], answer: 1,
    explanation: "La règle ABC (Airway, Breathing, Circulation) place la liberté des voies aériennes en toute première priorité." },
  { id: 11, type: "cas", theme: "soins",
    stem: "Un patient hospitalisé reçoit une prescription de perfusion à passer sur 6 heures, volume total 1000 ml, avec un perfuseur délivrant 20 gouttes/ml.",
    q: "Quel est le débit approximatif en gouttes par minute ?",

  { id: 13, type: "qcm", theme: "drepano",

  { id: 15, type: "cas", theme: "paludisme",

    explanation: "Les CTA comme l'Artéméther-Luméfantrine sont évitées au 1er trimestre par prudence (données limitées) mais recommandées dès le 2e trimestre selon les protocoles nationaux." },
  { id: 16, type: "qcm", theme: "soins",
    q: "Quelle est la définition de l'asepsie ?",
    options: ["Élimination totale de tout micro-organisme", "Ensemble de mesures pour empêcher l'introduction de micro-organismes", "Destruction des germes pathogènes uniquement", "Nettoyage simple à l'eau"], answer: 1,
    explanation: "L'asepsie regroupe les méthodes préventives visant à empêcher toute contamination microbienne d'un milieu, contrairement à l'antisepsie qui traite un milieu déjà contaminé." },

const TABS = [
  { key: "tous", label: "Tous" },
  { key: "qcm", label: "QCM" },
  { key: "cas", label: "Cas" },
  { key: "fiche", label: "Fiches" },
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function CarnetTerrain() {
  const [view, setView] = useState("entry"); // entry | quiz | admin-gate | admin
  const [name, setName] = useState("");
  const [nameDraft, setNameDraft] = useState("");
  const [saveError, setSaveError] = useState(false);
  const [codeDraft, setCodeDraft] = useState("");
  const [codeError, setCodeError] = useState(false);

  const [tab, setTab] = useState("tous");
  const [themeFilter, setThemeFilter] = useState("tous");
  const [order, setOrder] = useState(() => shuffle(DATA.map((d) => d.id)));
  const [pos, setPos] = useState(0);
  const [selected, setSelected] = useState(null);
  const [flipped, setFlipped] = useState(false);
  const [score, setScore] = useState({ correct: 0, seen: 0 });

  useEffect(() => {
    if (view !== "quiz" || !name || score.seen === 0) return;
    const id = name.trim().toLowerCase();
    const payload = { name: name.trim(), correct: score.correct, seen: score.seen, updatedAt: new Date().toISOString() };
    window.cloudStorage.saveSession(id, payload).catch(() => setSaveError(true));
  }, [score, view, name]);

  const filtered = useMemo(() => {
    return order
      .map((id) => DATA.find((d) => d.id === id))
      .filter((d) => (tab === "tous" ? true : d.type === tab))
      .filter((d) => (themeFilter === "tous" ? true : d.theme === themeFilter));
  }, [order, tab, themeFilter]);

  const current = filtered[pos % Math.max(filtered.length, 1)];

  const goNext = useCallback(() => {
    setSelected(null); setFlipped(false);
    setPos((p) => (filtered.length ? (p + 1) % filtered.length : 0));
  }, [filtered.length]);

  const goPrev = useCallback(() => {
    setSelected(null); setFlipped(false);
    setPos((p) => (filtered.length ? (p - 1 + filtered.length) % filtered.length : 0));
  }, [filtered.length]);

  const reshuffle = () => {
    setOrder(shuffle(DATA.map((d) => d.id)));
    setPos(0); setSelected(null); setFlipped(false);
    setScore({ correct: 0, seen: 0 });
  };

  const pick = (idx) => {
    if (selected !== null) return;
    setSelected(idx);
    setScore((s) => ({ correct: s.correct + (idx === current.answer ? 1 : 0), seen: s.seen + 1 }));
  };

  const changeTab = (key) => { setTab(key); setPos(0); setSelected(null); setFlipped(false); };
  const changeTheme = (key) => { setThemeFilter(key); setPos(0); setSelected(null); setFlipped(false); };

  const fontStyle = null;

  if (view === "entry") {
    return (
      <div style={styles.page}>
        <div style={styles.entryWrap}>
          <div style={styles.eyebrow}>CARNET</div>
          <h1 style={styles.title}>Terrain</h1>
          <p style={styles.tagline}>Révision paramédicale — cours & terrain</p>
          <div style={styles.entryCard}>
            <label style={styles.entryLabel}>Ton prénom (ou pseudo)</label>
            <input style={styles.entryInput} value={nameDraft} onChange={(e) => setNameDraft(e.target.value)}
              placeholder="ex. Awa, Junior…" maxLength={30} />
            <button style={styles.primaryBtn} disabled={!nameDraft.trim()}
              onClick={() => { setName(nameDraft.trim()); setView("quiz"); }}>
              Commencer
            </button>
            <p style={styles.entryHint}>Ton prénom permet au formateur de voir ta progression. Aucune autre donnée n'est demandée.</p>
            <button style={styles.adminLink} onClick={() => setView("admin-gate")}>Je suis formateur → voir les scores</button>
          </div>
        </div>
      </div>
    );
  }

  if (view === "admin-gate") {
    return (
      <div style={styles.page}>
        <div style={styles.entryWrap}>
          <div style={styles.eyebrow}>ACCÈS RÉSERVÉ</div>
          <h1 style={styles.title}>Formateur</h1>
          <p style={styles.tagline}>Entre le code pour voir les scores</p>
          <div style={styles.entryCard}>
            <label style={styles.entryLabel}>Code d'accès</label>
            <input style={styles.entryInput} type="password" value={codeDraft}
              onChange={(e) => { setCodeDraft(e.target.value); setCodeError(false); }}
              placeholder="••••••"
              onKeyDown={(e) => { if (e.key === "Enter") { if (codeDraft === window.ADMIN_CODE) setView("admin"); else setCodeError(true); } }} />
            {codeError && <p style={styles.codeError}>Code incorrect.</p>}
            <button style={styles.primaryBtn} disabled={!codeDraft}
              onClick={() => { if (codeDraft === window.ADMIN_CODE) setView("admin"); else setCodeError(true); }}>
              Valider
            </button>
            <button style={styles.adminLink} onClick={() => { setCodeDraft(""); setCodeError(false); setView(name ? "quiz" : "entry"); }}>← Retour</button>
          </div>
        </div>
      </div>
    );
  }

  if (view === "admin") {
    return (
      <div style={styles.page}>
        <AdminView onBack={() => setView(name ? "quiz" : "entry")} />
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div style={styles.headerTop}>
          <div>
            <div style={styles.eyebrow}>CARNET</div>
            <h1 style={styles.title}>Terrain</h1>
          </div>
          <div style={styles.scoreBox}>
            <div style={styles.scoreNum}>{score.correct}/{score.seen}</div>
            <div style={styles.scoreLabel}>{name}</div>
          </div>
        </div>
        <div style={styles.headerRow2}>
          <p style={styles.tagline}>Révision paramédicale — cours & terrain</p>
          <button style={styles.adminMini} onClick={() => setView("admin-gate")}>📊 Formateur</button>
        </div>
        {saveError && <p style={styles.saveError}>Score non synchronisé (vérifie ta connexion ou la config Firebase).</p>}
      </header>

      <nav className="ct-scroll" style={styles.tabRow}>
        {TABS.map((t) => (
          <button key={t.key} onClick={() => changeTab(t.key)}
            style={{ ...styles.tabBtn, ...(tab === t.key ? styles.tabBtnActive : {}) }}>
            {t.label}
          </button>
        ))}
      </nav>

      <div className="ct-scroll" style={styles.themeRow}>
        <button onClick={() => changeTheme("tous")}
          style={{ ...styles.themeChip, borderColor: themeFilter === "tous" ? "#1B2A4A" : "transparent",
            background: themeFilter === "tous" ? "#1B2A4A" : "#EFE9DA", color: themeFilter === "tous" ? "#F6F1E4" : "#1B2A4A" }}>
          Tous thèmes
        </button>
        {Object.entries(THEMES).map(([key, t]) => (
          <button key={key} onClick={() => changeTheme(key)}
            style={{ ...styles.themeChip, borderColor: themeFilter === key ? t.color : "transparent",
              background: themeFilter === key ? t.color : "#EFE9DA", color: themeFilter === key ? "#fff" : "#1B2A4A" }}>
            {t.label}
          </button>
        ))}
      </div>

      <main style={styles.main}>
        {!current ? (
          <div style={styles.empty}>
            <p style={styles.emptyText}>Aucune fiche pour ce filtre.</p>
            <button style={styles.primaryBtn} onClick={() => changeTheme("tous")}>Réinitialiser les filtres</button>
          </div>
        ) : (
          <Card item={current} theme={THEMES[current.theme]} index={pos + 1} total={filtered.length}
            selected={selected} flipped={flipped} onFlip={() => setFlipped((f) => !f)} onPick={pick} />
        )}
      </main>

      {current && (
        <footer style={styles.footer}>
          <button style={styles.navBtn} onClick={goPrev} aria-label="Précédent">‹</button>
          <button style={styles.shuffleBtn} onClick={reshuffle}>↻ Mélanger</button>
          <button style={styles.navBtn} onClick={goNext} aria-label="Suivant">›</button>
        </footer>
      )}
    </div>
  );
}

function AdminView({ onBack }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);

  const load = useCallback(async () => {
    setLoading(true); setError(false);
    try {
      const results = await window.cloudStorage.listSessions();
      const clean = results.filter(Boolean).sort((a, b) => b.correct / b.seen - a.correct / a.seen);
      setRows(clean);
    } catch { setError(true); } finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  return (
    <div style={styles.adminWrap}>
      <div style={styles.adminHeader}>
        <div>
          <div style={styles.eyebrow}>VUE FORMATEUR</div>
          <h2 style={styles.adminTitle}>Scores des répondants</h2>
        </div>
        <button style={styles.smallBtn} onClick={onBack}>Retour</button>
      </div>
      <button style={styles.refreshBtn} onClick={load}>↻ Actualiser</button>
      {loading && <p style={styles.adminMuted}>Chargement…</p>}
      {error && <p style={styles.adminMuted}>Impossible de charger les scores. Vérifie que Firebase est bien configuré (voir README).</p>}
      {!loading && !error && rows.length === 0 && <p style={styles.adminMuted}>Aucun répondant n'a encore commencé.</p>}
      {!loading && rows.length > 0 && (
        <div style={styles.adminTable}>
          {rows.map((r, i) => {
            const pct = Math.round((r.correct / r.seen) * 100);
            return (
              <div key={i} style={styles.adminRow}>
                <div style={styles.adminRank}>{i + 1}</div>
                <div style={styles.adminName}>{r.name}</div>
                <div style={styles.adminScore}>{r.correct}/{r.seen}<span style={styles.adminPct}> · {pct}%</span></div>
              </div>
            );
          })}
        </div>
      )}
      <p style={styles.adminNote}>
        Note : les scores sont stockés dans ta base Firebase. Le code d'accès protège l'affichage dans l'appli,
        mais si les règles Firestore sont en mode "test" (public), les données restent techniquement accessibles
        à qui saurait interroger la base directement. Pour un usage sérieux, restreins les règles Firestore.
      </p>
    </div>
  );
}

function Card({ item, theme, index, total, selected, flipped, onFlip, onPick }) {
  return (
    <div style={styles.card}>
      <div style={{ ...styles.cardTab, background: theme.color }}>
        <span style={styles.cardTabLabel}>{theme.label}</span>
        <span style={styles.cardTabIndex}>{index}/{total}</span>
      </div>
      <div style={styles.cardBody}>
        {item.type === "fiche" ? <FlashcardFace item={item} flipped={flipped} onFlip={onFlip} /> : <QuizFace item={item} selected={selected} onPick={onPick} />}
      </div>
    </div>
  );
}

function FlashcardFace({ item, flipped, onFlip }) {
  return (
    <div onClick={onFlip} style={styles.flashZone}>
      <div style={styles.flashKicker}>{flipped ? "RÉPONSE" : "FICHE MÉMO — touchez pour retourner"}</div>
      <p style={styles.flashText}>{flipped ? item.back : item.front}</p>
      <div style={styles.flashHint}>{flipped ? "↺ retourner" : "→ voir la réponse"}</div>
    </div>
  );
}

function QuizFace({ item, selected, onPick }) {
  const answered = selected !== null;
  return (
    <div>
      {item.stem && <p style={styles.stem}>{item.stem}</p>}
      <p style={styles.question}>{item.q}</p>
      <div style={styles.options}>
        {item.options.map((opt, idx) => {
          let bg = "#FBF8F1", border = "#DDD3BC", color = "#1B2A4A";
          if (answered) {
            if (idx === item.answer) { bg = "#E7F0E8"; border = "#4F7A5B"; color = "#2C4A34"; }
            else if (idx === selected) { bg = "#F6E5E3"; border = "#C1443C"; color = "#7A2E27"; }
          }
          return (
            <button key={idx} onClick={() => onPick(idx)} disabled={answered}
              style={{ ...styles.option, background: bg, borderColor: border, color, cursor: answered ? "default" : "pointer" }}>
              <span style={styles.optionLetter}>{String.fromCharCode(65 + idx)}</span>
              {opt}
            </button>
          );
        })}
      </div>
      {answered && (
        <div style={styles.explanation}>
          <div style={styles.explanationLabel}>{selected === item.answer ? "✓ Correct" : "✗ À revoir"}</div>
          <p style={styles.explanationText}>{item.explanation}</p>
        </div>
      )}
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "#101B2D", fontFamily: "'Inter', sans-serif", display: "flex", flexDirection: "column", paddingBottom: "24px" },
